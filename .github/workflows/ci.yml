name: CI

# Required check on main (branch protection): a PR cannot be merged unless this job is green.
# Vercel still deploys on its own (native Git integration + vercel-deploy.yml hook); this job
# gates what can REACH main, not the deploy mechanism itself.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bunx eslint src tests

      # `bun run test` = `vitest run` (package.json). Never `bun test`: bun's own runner lacks
      # vi.stubGlobal and silently skips whole files (see CLAUDE.md > Testing).
      - name: Test
        run: bun run test
